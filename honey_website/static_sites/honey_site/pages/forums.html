<h2>Community Forums</h2>

<section id="forum-threads"></section>

<form id="new-post-form">
    <h3>Start a new discussion</h3>
    <input type="text" id="post-username" placeholder="Your name (optional, defaults to Anonymous)" value="" />
    <input type="text" id="post-title" placeholder="Topic title*" required />
    <textarea id="post-body" placeholder="Your message...*" rows="4" required></textarea>
    <button type="submit">Post</button>
</form>
