[project]
name = "data_collection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "browser-use==0.9.2",
    "dotenv>=0.9.9",
    "ipykernel>=7.1.0",
    "playwright>=1.55.0",
    "psutil>=7.1.3",
    "psycopg2-binary>=2.9.11",
    "pyautogui>=0.9.54; sys_platform != 'linux'",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.1.1",
    "pywinctl>=0.4.1",
    "requests>=2.32.5",
    "skyvern==0.2.23",
    "tqdm>=4.67.1",
]

[tool.uv]
override-dependencies = [
    "pillow>=11.2.1",
    "anthropic>=0.68.1",
    "websockets>=15.0.1",
]

[tool.uv.sources]
data_collection = { path = "data_collection" }
